# Loopback-only load-test configuration. A debug orihsus binary built with
# `loadtest-insecure-upstream` pins upstream to https://127.0.0.1:18443/ and
# accepts its synthetic certificate. Release builds reject that feature.
listen:
  host: "127.0.0.1"
  port: 18444
gateway_token: "loadtest-gateway-token"
keys:
  - "mock-key-1"
  - "mock-key-2"
models:
  - "deepseek-chat"
limits:
  max_concurrency: 200
  max_queue: 500
  queue_wait_timeout_seconds: 30
  max_body_bytes: 1048576
  max_inflight_body_bytes: 268435456
key_failure_handling:
  backoff_initial_seconds: 1
  backoff_max_seconds: 5
  breaker_threshold: 5
  breaker_cooldown_seconds: 5
  max_attempts: 2
audit:
  path: "/tmp/orihsus-loadtest/audit.jsonl"
  queue_capacity: 4096
server:
  read_header_timeout_seconds: 5
  max_header_bytes: 32768
  max_connections: 1024
  body_read_timeout_seconds: 30
  upstream_response_header_timeout_seconds: 60
  upstream_error_body_timeout_seconds: 5
  response_write_timeout_seconds: 30
