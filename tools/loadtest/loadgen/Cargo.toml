[package]
name = "loadgen"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
http = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
tokio-rustls = "0.26"
url = "2"
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
