# orihsus example configuration
#
# Install as the service user because the file contains plaintext credentials:
#   sudo install -o orihsus -g orihsus -m 0600 config.example.yaml /etc/orihsus/config.yaml
# The resulting ownership and mode must be orihsus:orihsus and 0600.
#
# orihsus serves plaintext HTTP on loopback only. nginx owns the public
# TLS/HTTP2, rate-limit, and access-log boundary.

listen: "127.0.0.1:8080"

# Bearer token required from gateway clients. Replace with a long random value.
gateway_token: "CHANGE-ME-use-a-long-random-token"

# OpenCode Go upstream. HTTPS is mandatory. A path prefix is normalized to a
# trailing slash; query strings and fragments are rejected.
upstream:
  base_url: "https://api.opencode.go"

# Subscription API-key pool.
keys:
  - "CHANGE-ME-upstream-key-1"
  - "CHANGE-ME-upstream-key-2"

# Proactive OpenCode Go usage polling. Changes require restart; a hot-reloaded
# key set is polled immediately. poll_interval must be at least 30 seconds.
usage:
  soft_threshold_percent: 80
  poll_interval: "5m"

# Static values returned by GET /v1/models. This list is hot-reloadable and
# must contain unique, non-blank entries.
models:
  - "deepseek-chat"
  - "deepseek-reasoner"

limits:
  max_concurrency: 200
  max_queue: 500
  queue_wait_timeout: "30s"
  max_body_bytes: "10MiB"
  # Each body reserves max_body_bytes from this global budget before reading.
  # The value must be >= max_body_bytes and <= u32::MAX.
  max_inflight_body_bytes: "256MiB"

rotation:
  backoff_initial: "5s"
  backoff_max: "60s"
  breaker_threshold: 5
  breaker_cooldown: "60s"
  max_attempts: 2

audit:
  path: "/var/log/orihsus/audit.jsonl"
  queue_capacity: 4096

server:
  # These are defense-in-depth limits for the nginx-to-orihsus hop. nginx must
  # independently enforce its public-client limits and timeouts.
  read_header_timeout: "5s"
  max_header_bytes: "32KiB"
  max_connections: 1024
  body_read_timeout: "30s"
  upstream_response_header_timeout: "60s"
  upstream_error_body_timeout: "5s"
  response_write_timeout: "30s"
