# orihsus 配置示例
#
# 部署：复制到 /etc/orihsus/config.yaml，
#   sudo chown orihsus:orihsus /etc/orihsus/config.yaml
#   sudo chmod 600             /etc/orihsus/config.yaml
# 注意：配置文件必须为 0600 且属主为服务用户 orihsus（systemd User=orihsus
# 需可读），否则拒绝启动（key 明文存储）。
# 本文件含占位值，直接使用会因必配项校验或权限而失败——替换后部署。

# 监听地址。注意：进程拒绝以 root 运行，且 systemd 沙箱清空 capabilities，
# 因此不能绑定 443；请用高位端口（下面 8443），如需 443 前置反代。
listen: "0.0.0.0:8443"

# TLS：证书/私钥必须已存在（ACME 或自签均可），路径必配。
tls:
  cert_path: "/etc/orihsus/cert.pem"
  key_path: "/etc/orihsus/key.pem"

# gateway Bearer token，防滥用，务必替换为长随机串。
gateway_token: "CHANGE-ME-use-a-long-random-token"

# 上游：OpenCode Go API。必须是 https；路径前缀会被规范化到尾部斜杠
# （`/openai` 与 `/openai/` 等价），不允许携带 query 或 fragment。
upstream:
  base_url: "https://api.opencode.go"

# 轮换 key 池（每个订阅的 API key 一行）。
keys:
  - "CHANGE-ME-upstream-key-1"
  - "CHANGE-ME-upstream-key-2"

# 主动查询 OpenCode Go usage（省略时仍默认启用 80%/5m）。usage 策略改动需
# 重启；keys 仍可热更，新 key 会立即补查。poll_interval 最小 30s。
usage:
  soft_threshold_percent: 80
  poll_interval: "5m"

# GET /v1/models 返回的静态模型列表（默认 ["deepseek-chat"]，向后兼容）。
# 必填约束：非空、不能空白、不能重复；模型名原样透传，网关不做映射/校验。
# 可热重载：改此列表对新的 /v1/models 请求即时生效。
models:
  - "deepseek-chat"
  - "deepseek-reasoner"

# 容量控制。
limits:
  max_concurrency: 200
  max_queue: 500
  queue_wait_timeout: "30s"
  max_body_bytes: "10MiB"
  # 全局在飞请求体字节预算：同时缓冲的请求体总量不超过该值（默认 256MiB）。
  # 若 200×10MiB 并发同时慢速上传，正文常驻可达 ~2GiB；有了该预算，读 body 前
  # 按 max_body_bytes 预留，并一直持有到请求体已交给上游（上游 headers/终态返回）
  # 才释放——等待上游阶段也计入上限，而下游响应流不占预算。正文内存硬上限即此值。
  # 必须 >= max_body_bytes，且 <= u32::MAX（tokio semaphore permit 是 u32）。
  max_inflight_body_bytes: "256MiB"

# 失败/熔断边界（soft_threshold 已移除，勿写该字段）。backoff_max 上限为 90d
# （运维冷却天花板），更大的值会被拒绝——否则 jitter 加法会溢出。
rotation:
  backoff_initial: "5s"
  backoff_max: "60s"
  breaker_threshold: 5
  breaker_cooldown: "60s"
  max_attempts: 2

# 审计 JSONL（调用计数）。目录需或ihsus 用户可写，如 /var/log/orihsus。
audit:
  path: "/var/log/orihsus/audit.jsonl"
  queue_capacity: 4096

# HTTP server 加固。
server:
  read_header_timeout: "5s"
  max_header_bytes: "32KiB"
  # 连接级总量上限：同时的 TCP 连接数（含未完成 TLS 握手 / header slowloris）。
  # 满时 accept 后立即关闭新 socket 且不 spawn——未认证/TLS/慢 header 连接也计入，
  # 无法把任务/FD 撑到无限。上限 65536（systemd LimitNOFILE 的 FD 预算）。
  max_connections: 1024
  # 客户端发送请求体（上传）的上限时长；停滞上传超时后返回 503 + Retry-After。
  body_read_timeout: "30s"
  # 上游从连接建立到返回 response headers 的上限时长；只包 send 到 headers，
  # 不限制 SSE body 流。超时按网络失败换下一个 key。改 server.* 需重启。
  upstream_response_header_timeout: "60s"
  # 上游错误响应（429/401/403/5xx）body 分类读取的上限时长。整个 body 必须在
  # 期限内完整到达（含超过 64KiB 分类上限的余流），否则视为网络失败、丢弃部分
  # body 并换下一个 key——绝不把部分 body 当作完整上游错误透传给客户端。默认 5s。
  # 同一超时也作为非流式（非 SSE）成功响应体逐读的空闲上限：上游发完部分 body
  # 后停滞，客户端仍在读取时，超过该时长即结束响应、释放 admission permit 并
  # 记网络失败——有限长 JSON body 不能无限占位。SSE 读取永不受此限制。
  upstream_error_body_timeout: "5s"
  # 单 chunk 写下游的上限时长：客户端停止读取时网关 16-slot 响应队列会占满，
  # pump 停在 tx.send 上；超过本时长即结束该响应流、取消上游连接并释放 admission
  # permit。每成功送出一次即重新计时（慢但持续消费的客户端不受影响）；对 SSE
  # 上游读取绝无限制——静默长连 SSE 可无限存活（非 SSE 上游读取由上面的
  # upstream_error_body_timeout 有界）。默认 30s。
  response_write_timeout: "30s"
