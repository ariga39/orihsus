# Minimal orihsus configuration
#
# Install as the service user because this file contains plaintext credentials:
#   sudo install -o orihsus -g orihsus -m 0600 config.example.yaml /etc/orihsus/config.yaml
# The resulting ownership and mode must be orihsus:orihsus and 0600.
#
# Optional settings are intentionally omitted. See README.md for the complete
# schema, types, required status, and defaults.

# Required: bearer token accepted from gateway clients.
gateway_keys:
  - name: "hermes-main"
    token: "CHANGE-ME-use-a-long-random-token"
  - name: "coding-agent"
    token: "CHANGE-ME-use-a-different-long-random-token"

# Required: non-empty pool of unique OpenCode Go subscription keys.
keys:
  - "CHANGE-ME-upstream-key-1"
  - "CHANGE-ME-upstream-key-2"

# Models are fetched from OpenCode Go immediately at startup and hourly.
# To pin a manual allowlist instead, add `models: ["deepseek-chat"]`.
model_sync:
  interval_seconds: 3600
