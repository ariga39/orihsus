name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run default-feature tests
        run: cargo test --all-targets

      - name: Build production release with default features
        run: cargo build --release

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          createIssues: false

      - name: Assert insecure load-test feature cannot build in release
        shell: bash
        run: |
          set +e
          output="$(cargo build --release --all-features 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "release --all-features unexpectedly succeeded" >&2
            exit 1
          fi
          if ! grep -Fq "loadtest-insecure-upstream is forbidden in release builds" <<<"$output"; then
            echo "release failed for a reason other than the security compile guard" >&2
            exit 1
          fi

      - name: Run debug tests with all features
        run: cargo test --all-targets --all-features
