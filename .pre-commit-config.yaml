repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        files: \.rs$
        pass_filenames: false
        always_run: true

      - id: clippy
        name: cargo clippy -- -D warnings
        entry: cargo clippy -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
        always_run: true
